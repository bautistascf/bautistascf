<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portal de Socios | Bautistas CF</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .top-bar {
            height: 55px;
            width: 100%;
            background: #081827;
            display: flex;
            align-items: center;
            padding: 0 25px;
            position: relative;
            z-index: 10;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #ffffff;
            text-decoration: none;
            font-family: Arial, sans-serif;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.5px;
            padding: 10px 16px;
            border: 1px solid #d4af37;
            border-radius: 8px;
            transition: 0.3s ease;
        }

        .back-button:hover {
            background: #d4af37;
            color: #081827;
        }

        iframe {
            display: block;
            width: 100%;
            height: calc(100vh - 55px);
            border: none;
        }
    </style>
</head>

<body>

    <div class="top-bar">
        <a href="../index.html" class="back-button">
            ← VOLVER A BAUTISTAS CF
        </a>
    </div>

    <iframe
        src="https://bautistascf.github.io/portal-socios/"
        title="Portal de Socios Bautistas CF">
    </iframe>

</body>
</html>
